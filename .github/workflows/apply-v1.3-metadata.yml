name: apply v1.3 metadata implementation

on:
  push:
    branches:
      - feature/reader-metadata-editing-v1.3.0
    paths:
      - .automation/v1.3.patch.part00
      - .automation/v1.3.patch.part01
      - .automation/v1.3.patch.part02
      - .automation/v1.3.patch.part03
      - .automation/v1.3.patch.part04
      - .automation/v1.3-ui-fix.patch.b64
      - .github/workflows/apply-v1.3-metadata.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/reader-metadata-editing-v1.3.0
          fetch-depth: 0

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev libsqlite3-dev luarocks zip
          sudo luarocks --lua-version=5.1 install lsqlite3

      - name: Reconstruct and verify staged patches
        run: |
          cat .automation/v1.3.patch.part00 .automation/v1.3.patch.part01 .automation/v1.3.patch.part02 .automation/v1.3.patch.part03 .automation/v1.3.patch.part04 > /tmp/v1.3.patch.gz.b64
          echo '1e96f9a540f913804d129c78c3a4ead44d5522748955511389bdc82cc29d49be  /tmp/v1.3.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/v1.3.patch.gz.b64 | gzip -dc > /tmp/v1.3.patch
          echo 'f1e8e45bb3548695156707c62ca8a76fd21498094fb16124e0020d6173ff4a2a  /tmp/v1.3.patch' | sha256sum -c -
          base64 -d .automation/v1.3-ui-fix.patch.b64 > /tmp/v1.3-ui-fix.patch
          echo 'cd9e58419e4401aafa22efdb0968f3583e093e0a41343b8f7af966de646a75ae  /tmp/v1.3-ui-fix.patch' | sha256sum -c -

      - name: Apply staged implementation
        run: |
          git apply --check /tmp/v1.3.patch
          git apply /tmp/v1.3.patch
          git apply --check /tmp/v1.3-ui-fix.patch
          git apply /tmp/v1.3-ui-fix.patch

      - name: Register and normalize new tests
        run: |
          python3 - <<'PY'
          from pathlib import Path

          run = Path('readwisereader.koplugin/tests/run.lua')
          text = run.read_text()
          marker = '    "tests.test_annotation_mutations",\n'
          additions = ''.join([
              '    "tests.test_annotation_note_clear",\n',
              '    "tests.test_annotation_upload_metadata",\n',
              '    "tests.test_metadata_tags",\n',
              '    "tests.test_metadata_mutations",\n',
              '    "tests.test_metadata_storage",\n',
          ])
          if 'tests.test_metadata_mutations' not in text:
              if marker not in text:
                  raise SystemExit('test insertion marker not found')
              run.write_text(text.replace(marker, marker + additions))

          test = Path('readwisereader.koplugin/tests/test_annotation_upload_metadata.lua')
          body = test.read_text()
          old = '''    assert(upload:_prepareQueue(\n        { reader_id = "doc-1" },\n        {\n            local_annotation_id = "ann-1",\n            text = "Selected",\n            note = "note",\n            text_hash = "th",\n            note_hash = "nh",\n        },\n        "Selected",\n        "marker"\n    ))\n    local payload = jsonDecode(captured.payload_json)\n'''
          new = '''    local prepared = upload:_prepareQueue(\n        { reader_id = "doc-1" },\n        {\n            local_annotation_id = "ann-1",\n            text = "Selected",\n            note = "note",\n            text_hash = "th",\n            note_hash = "nh",\n        },\n        "Selected",\n        "marker"\n    )\n    assert(prepared)\n    local payload = jsonDecode(captured.payload_json)\n'''
          if old not in body:
              raise SystemExit('annotation upload test normalization marker not found')
          test.write_text(body.replace(old, new, 1))
          PY

      - name: Remove staging payloads
        run: rm -f .automation/v1.3.patch.gz.b64 .automation/v1.3.patch.part* .automation/v1.3-ui-fix.patch.b64

      - name: Run development checks
        run: ./scripts/dev-check.sh

      - name: Run Lua unit tests
        run: lua5.1 readwisereader.koplugin/tests/run.lua

      - name: Build and verify installable ZIP
        run: |
          ./scripts/package.sh
          unzip -t dist/readwisereader.koplugin.zip
          unzip -Z1 dist/readwisereader.koplugin.zip | grep -Fx 'readwisereader.koplugin/_meta.lua'
          unzip -Z1 dist/readwisereader.koplugin.zip | grep -Fx 'readwisereader.koplugin/main.lua'
          ! unzip -Z1 dist/readwisereader.koplugin.zip | grep -F '/tests/'

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add safe Reader metadata editing'
          git push origin HEAD:feature/reader-metadata-editing-v1.3.0
