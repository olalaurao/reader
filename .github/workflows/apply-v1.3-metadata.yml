name: finalize and clean v1.3 candidate

on:
  push:
    branches:
      - feature/reader-metadata-editing-v1.3.0
    paths:
      - .automation/cleanup-v1.3.py
      - .github/workflows/apply-v1.3-metadata.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/reader-metadata-editing-v1.3.0
          fetch-depth: 0

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev libsqlite3-dev luarocks zip
          sudo luarocks --lua-version=5.1 install lsqlite3

      - name: Apply final race fix, docs, version and cleanup
        run: python3 .automation/cleanup-v1.3.py

      - name: Prove temporary staging is gone
        run: |
          test ! -e .automation
          test ! -e .github/workflows/apply-v1.3-metadata.yml

      - name: Run development checks
        run: ./scripts/dev-check.sh

      - name: Run full Lua unit suite
        run: lua5.1 readwisereader.koplugin/tests/run.lua

      - name: Build and verify installable ZIP
        run: |
          ./scripts/package.sh
          unzip -t dist/readwisereader.koplugin.zip
          unzip -Z1 dist/readwisereader.koplugin.zip | grep -Fx 'readwisereader.koplugin/_meta.lua'
          unzip -Z1 dist/readwisereader.koplugin.zip | grep -Fx 'readwisereader.koplugin/main.lua'
          ! unzip -Z1 dist/readwisereader.koplugin.zip | grep -F '/tests/'
          ! unzip -Z1 dist/readwisereader.koplugin.zip | grep -F '.automation'

      - name: Commit clean validated candidate
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize clean v1.3.0 release candidate'
          remote_sha="$(git ls-remote origin refs/heads/feature/reader-metadata-editing-v1.3.0 | cut -f1)"
          trigger_sha="${GITHUB_SHA}"
          test "$remote_sha" = "$trigger_sha"
          git push origin HEAD:feature/reader-metadata-editing-v1.3.0
