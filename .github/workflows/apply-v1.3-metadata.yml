name: finalize v1.3 metadata implementation

on:
  push:
    branches:
      - feature/reader-metadata-editing-v1.3.0
    paths:
      - .automation/finalize-v1.3.py
      - .github/workflows/apply-v1.3-metadata.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: feature/reader-metadata-editing-v1.3.0
          fetch-depth: 0

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev libsqlite3-dev luarocks zip
          sudo luarocks --lua-version=5.1 install lsqlite3

      - name: Normalize current source anchors for deterministic patching
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('readwisereader.koplugin/ui/sync.lua')
          text = p.read_text()
          old = '        string.format(_("Reader → KOReader pre-sync reconciliation: %s"), report.remote_highlight_import_status or _("not run")),'
          new = '''        string.format(
                      _("Reader → KOReader pre-sync reconciliation: %s"),
                      report.remote_highlight_import_status or _("not run")
                  ),'''
          if old not in text:
              raise SystemExit('sync report anchor not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('readwisereader.koplugin/tests/test_sync_ui.lua')
          text = p.read_text()
          old = '''        assert(SyncUI._errorText({
                      kind = "worker",
                      stage = "annotation_backlog",
                  }):find("stage: annotation_backlog", 1, true))
'''
          new = '        assert(SyncUI._errorText({ kind = "worker", stage = "annotation_backlog" }):find("annotation_backlog", 1, true))\n'
          if old not in text:
              raise SystemExit('sync UI test anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Apply final v1.3 worker and hardening edits
        run: python3 .automation/finalize-v1.3.py

      - name: Run development checks
        run: ./scripts/dev-check.sh

      - name: Run Lua unit tests
        run: lua5.1 readwisereader.koplugin/tests/run.lua

      - name: Build and verify installable ZIP
        run: |
          ./scripts/package.sh
          unzip -t dist/readwisereader.koplugin.zip
          unzip -Z1 dist/readwisereader.koplugin.zip | grep -Fx 'readwisereader.koplugin/_meta.lua'
          unzip -Z1 dist/readwisereader.koplugin.zip | grep -Fx 'readwisereader.koplugin/main.lua'
          ! unzip -Z1 dist/readwisereader.koplugin.zip | grep -F '/tests/'

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add readwisereader.koplugin
          git diff --cached --quiet && exit 0
          git commit -m 'Integrate Reader metadata queue into Sync now'
          remote_sha="$(git ls-remote origin refs/heads/feature/reader-metadata-editing-v1.3.0 | cut -f1)"
          trigger_sha="${GITHUB_SHA}"
          test "$remote_sha" = "$trigger_sha"
          git push origin HEAD:feature/reader-metadata-editing-v1.3.0
