name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 liblua5.1-0-dev libsqlite3-dev luarocks zip
          sudo luarocks --lua-version=5.1 install lsqlite3

      - name: Run development checks
        run: ./scripts/dev-check.sh

      - name: Run Lua unit tests
        run: lua5.1 readwisereader.koplugin/tests/run.lua

      - name: Build installable plugin ZIP
        run: ./scripts/package.sh

      - name: Verify package layout
        run: |
          unzip -l dist/readwisereader.koplugin.zip
          unzip -Z1 dist/readwisereader.koplugin.zip | grep -Fx 'readwisereader.koplugin/_meta.lua'
          unzip -Z1 dist/readwisereader.koplugin.zip | grep -Fx 'readwisereader.koplugin/main.lua'
          ! unzip -Z1 dist/readwisereader.koplugin.zip | grep -F '/tests/'

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: readwisereader-koplugin-${{ github.sha }}
          path: dist/readwisereader.koplugin.zip
          if-no-files-found: error
